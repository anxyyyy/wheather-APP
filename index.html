<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly — Real-Time Weather</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        /* --- Переменные и сброс стилей --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.25);
            --text-color: #2c3e50;
            --text-muted: #5a6b7c;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --blur: blur(12px);
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        [data-theme="dark"] {
            --glass-bg: rgba(15, 22, 36, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Градиенты погоды */
        .bg-clear { --bg-gradient: linear-gradient(135deg, #fcebc4 0%, #f99f1b 100%); }
        .bg-rain { --bg-gradient: linear-gradient(135deg, #616161 0%, #4b79a1 100%); }
        .bg-clouds { --bg-gradient: linear-gradient(135deg, #e0e0e0 0%, #b3cdd1 100%); }
        .bg-snow { --bg-gradient: linear-gradient(135deg, #e6f7ff 0%, #aecadb 100%); }
        .bg-night { --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.8s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        /* --- Контейнер приложения --- */
        .app-container {
            width: 100%;
            max-width: 650px;
            background: var(--glass-bg);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 30px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        /* --- Шапка --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .icon-btn:hover {
            transform: scale(1.1) rotate(15deg);
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- Поиск --- */
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--glass-border);
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 1rem;
            color: var(--text-color);
            outline: none;
            transition: var(--transition);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .search-box button {
            background: var(--text-color);
            color: var(--glass-bg);
            border: none;
            padding: 0 22px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: var(--transition);
        }

        .search-box button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* --- История поиска --- */
        .search-history {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .history-tag {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--glass-border);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .history-tag:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        /* --- Главная карточка --- */
        .main-card {
            text-align: center;
            padding: 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            margin-bottom: 25px;
            animation: fadeInScale 0.6s ease-out forwards;
        }

        .location {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 1.4rem;
            font-weight: 600;
        }

        .last-update {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .weather-main {
            margin-top: 20px;
        }

        .weather-emoji {
            font-size: 4.5rem;
            display: block;
            margin-bottom: 10px;
        }

        .temp-container {
            display: inline-block;
        }

        .temp {
            font-size: 4rem;
            font-weight: 800;
        }

        .unit {
            font-size: 1.8rem;
            vertical-align: super;
            font-weight: 500;
        }

        .description {
            font-size: 1.2rem;
            text-transform: capitalize;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* --- Сетка статистики --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: var(--transition);
            animation: fadeInScale 0.6s ease-out forwards;
        }

        .stat-card:hover {
            transform: translateY(-4px) scale(1.02);
            background: rgba(255, 255, 255, 0.25);
        }

        .stat-icon {
            font-size: 2rem;
            color: var(--text-color);
            background: rgba(255,255,255,0.2);
            padding: 8px;
            border-radius: 14px;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* --- Прогноз --- */
        .forecast-section h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            padding: 15px 10px;
            border-radius: 18px;
            text-align: center;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .forecast-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .forecast-day {
            font-weight: 600;
            color: var(--text-muted);
        }

        .forecast-emoji {
            font-size: 1.8rem;
            margin: 8px 0;
            display: block;
        }

        .forecast-temp {
            font-weight: 700;
        }

        /* --- Утилиты (Лоадер, Ошибки) --- */
        .hidden {
            display: none !important;
        }

        .error-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 15px;
            border-radius: 16px;
            color: #b91c1c;
            margin-bottom: 20px;
        }

        [data-theme="dark"] .error-box {
            color: #fca5a5;
        }

        .loader {
            display: flex;
            justify-content: center;
            padding: 30px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--text-color);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        /* --- Анимации --- */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* --- Адаптивность --- */
        @media (max-width: 550px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .forecast-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .forecast-card:nth-child(4), .forecast-card:nth-child(5) {
                display: none;
            }
            .app-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <button id="geo-btn" class="icon-btn" title="Use My Location">
                <span class="material-icons-round">my_location</span>
            </button>
            <h1 class="logo">Weatherly</h1>
            <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
                <span class="material-icons-round" id="theme-icon">dark_mode</span>
            </button>
        </header>

        <div class="search-box">
            <input type="text" id="city-input" placeholder="Search city (e.g. Dushanbe, London)..." autocomplete="off">
            <button id="search-btn">
                <span class="material-icons-round">search</span>
            </button>
        </div>

        <div id="search-history" class="search-history"></div>

        <div id="loader" class="loader hidden">
            <div class="spinner"></div>
        </div>

        <div id="error-box" class="error-box hidden">
            <span class="material-icons-round">error_outline</span>
            <p id="error-message"></p>
        </div>

        <main id="weather-content" class="weather-content hidden">
            <div class="main-card">
                <div class="location">
                    <span class="material-icons-round">location_on</span>
                    <h2 id="city-name">Dushanbe</h2>, <span id="country-code">TJ</span>
                </div>
                <p id="last-update" class="last-update"></p>
                
                <div class="weather-main">
                    <span id="weather-icon" class="weather-emoji">☀️</span>
                    <div class="temp-container">
                        <span id="main-temp" class="temp">24</span><span class="unit">°C</span>
                    </div>
                    <p id="weather-desc" class="description">Clear Sky</p>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="material-icons-round stat-icon">device_thermostat</span>
                    <div class="stat-info">
                        <p class="stat-label">Feels Like</p>
                        <p id="feels-like" class="stat-value">26°C</p>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="material-icons-round stat-icon">water_drop</span>
                    <div class="stat-info">
                        <p class="stat-label">Humidity</p>
                        <p id="humidity" class="stat-value">40%</p>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="material-icons-round stat-icon">air</span>
                    <div class="stat-info">
                        <p class="stat-label">Wind Speed</p>
                        <p id="wind-speed" class="stat-value">3.2 m/s</p>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="material-icons-round stat-icon">compress</span>
                    <div class="stat-info">
                        <p class="stat-label">Pressure</p>
                        <p id="pressure" class="stat-value">1012 hPa</p>
                    </div>
                </div>
            </div>

            <div class="forecast-section">
                <h3>5-Day Forecast</h3>
                <div id="forecast-container" class="forecast-grid"></div>
            </div>
        </main>
    </div>

    <script>
        const API_KEY = "d240df30e3d32ce400177950a1e9cde4"; 
        const WEATHER_BASE_URL = "https://api.openweathermap.org/data/2.5/weather";
        const FORECAST_BASE_URL = "https://api.openweathermap.org/data/2.5/forecast";

        const cityInput = document.getElementById('city-input');
        const searchBtn = document.getElementById('search-btn');
        const geoBtn = document.getElementById('geo-btn');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const loader = document.getElementById('loader');
        const errorBox = document.getElementById('error-box');
        const errorMessage = document.getElementById('error-message');
        const weatherContent = document.getElementById('weather-content');
        const historyContainer = document.getElementById('search-history');

        const cityName = document.getElementById('city-name');
        const countryCode = document.getElementById('country-code');
        const lastUpdate = document.getElementById('last-update');
        const weatherIcon = document.getElementById('weather-icon');
        const mainTemp = document.getElementById('main-temp');
        const weatherDesc = document.getElementById('weather-desc');
        const feelsLike = document.getElementById('feels-like');
        const humidity = document.getElementById('humidity');
        const windSpeed = document.getElementById('wind-speed');
        const pressure = document.getElementById('pressure');
        const forecastContainer = document.getElementById('forecast-container');

        const weatherEmojis = {
            Clear: "☀️", Clouds: "☁️", Rain: "🌧", Drizzle: "🌦",
            Thunderstorm: "⛈", Snow: "❄️", Mist: "🌫", Smoke: "🌫",
            Haze: "🌫", Dust: "🌫", Fog: "🌫"
        };

        let searchHistory = JSON.parse(localStorage.getItem('weather_history')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderHistory();
            const defaultCity = searchHistory.length > 0 ? searchHistory[0] : "Dushanbe";
            getWeatherData(defaultCity);
        });

        function initTheme() {
            const savedTheme = localStorage.getItem('weather_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeIcon.textContent = savedTheme === 'dark' ? 'light_mode' : 'dark_mode';
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('weather_theme', newTheme);
            themeIcon.textContent = newTheme === 'dark' ? 'light_mode' : 'dark_mode';
            updateBackground(document.body.dataset.weatherCondition);
        });

        function updateBackground(condition) {
            document.body.className = '';
            document.body.dataset.weatherCondition = condition;
            if (document.documentElement.getAttribute('data-theme') === 'dark') {
                document.body.classList.add('bg-night');
                return;
            }
            switch(condition) {
                case 'Clear': document.body.classList.add('bg-clear'); break;
                case 'Rain': case 'Drizzle': case 'Thunderstorm': document.body.classList.add('bg-rain'); break;
                case 'Clouds': document.body.classList.add('bg-clouds'); break;
                case 'Snow': document.body.classList.add('bg-snow'); break;
                default: document.body.classList.add('bg-clouds');
            }
        }

        async function getWeatherData(query, isCoords = false) {
            showLoader(true);
            showError(false);
            if (!window.navigator.onLine) {
                showError(true, "Connection error");
                showLoader(false);
                return;
            }
            try {
                let currentUrl, forecastUrl;
                if (isCoords) {
                    currentUrl = `${WEATHER_BASE_URL}?lat=${query.lat}&lon=${query.lon}&units=metric&appid=${API_KEY}`;
                    forecastUrl = `${FORECAST_BASE_URL}?lat=${query.lat}&lon=${query.lon}&units=metric&appid=${API_KEY}`;
                } else {
                    if (!query.trim()) {
                        showError(true, "Please enter a city name");
                        showLoader(false);
                        return;
                    }
                    currentUrl = `${WEATHER_BASE_URL}?q=${encodeURIComponent(query)}&units=metric&appid=${API_KEY}`;
                    forecastUrl = `${FORECAST_BASE_URL}?q=${encodeURIComponent(query)}&units=metric&appid=${API_KEY}`;
                }

                const [currentRes, forecastRes] = await Promise.all([fetch(currentUrl), fetch(forecastUrl)]);

                if (currentRes.status === 404) {
                    showError(true, "City not found");
                    showLoader(false);
                    return;
                }
                if (!currentRes.ok || !forecastRes.ok) throw new Error("API Error");

                const currentData = await currentRes.json();
                const forecastData = await forecastRes.json();

                displayCurrentWeather(currentData);
                displayForecast(forecastData);
                if (!isCoords) saveToHistory(currentData.name);
                weatherContent.classList.remove('hidden');
            } catch (err) {
                showError(true, "Connection error");
            } finally {
                showLoader(false);
            }
        }

        function displayCurrentWeather(data) {
            const condition = data.weather[0].main;
            cityName.textContent = data.name;
            countryCode.textContent = data.sys.country;
            mainTemp.textContent = Math.round(data.main.temp);
            feelsLike.textContent = `${Math.round(data.main.feels_like)}°C`;
            humidity.textContent = `${data.main.humidity}%`;
            windSpeed.textContent = `${data.wind.speed} m/s`;
            pressure.textContent = `${data.main.pressure} hPa`;
            weatherDesc.textContent = data.weather[0].description;
            weatherIcon.textContent = weatherEmojis[condition] || "✨";
            const now = new Date();
            lastUpdate.textContent = `Last updated: ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            updateBackground(condition);
        }

        function displayForecast(data) {
            forecastContainer.innerHTML = '';
            const dailyData = data.list.filter(item => item.dt_txt.includes("12:00:00"));
            dailyData.forEach(day => {
                const date = new Date(day.dt * 1000);
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                const condition = day.weather[0].main;
                const emoji = weatherEmojis[condition] || "✨";
                const temp = Math.round(day.main.temp);
                const card = document.createElement('div');
                card.className = 'forecast-card';
                card.innerHTML = `<p class="forecast-day">${dayName}</p><span class="forecast-emoji">${emoji}</span><p class="forecast-temp">${temp}°C</p>`;
                forecastContainer.appendChild(card);
            });
        }

        function saveToHistory(city) {
            searchHistory = searchHistory.filter(c => c.toLowerCase() !== city.toLowerCase());
            searchHistory.unshift(city);
            if (searchHistory.length > 5) searchHistory.pop();
            localStorage.setItem('weather_history', JSON.stringify(searchHistory));
            renderHistory();
        }

        function renderHistory() {
            historyContainer.innerHTML = '';
            searchHistory.forEach(city => {
                const tag = document.createElement('span');
                tag.className = 'history-tag';
                tag.textContent = city;
                tag.addEventListener('click', () => { cityInput.value = city; getWeatherData(city); });
                historyContainer.appendChild(tag);
            });
        }

        function showLoader(show) {
            if (show) { loader.classList.remove('hidden'); weatherContent.classList.add('hidden'); }
            else { loader.classList.add('hidden'); }
        }

        function showError(show, message = "") {
            if (show) { errorMessage.textContent = message; errorBox.classList.remove('hidden'); weatherContent.classList.add('hidden'); }
            else { errorBox.classList.add('hidden'); }
        }

        searchBtn.addEventListener('click', () => getWeatherData(cityInput.value));
        cityInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') getWeatherData(cityInput.value); });
        geoBtn.addEventListener('click', () => {
            if (navigator.geolocation) {
                showLoader(true);
                navigator.geolocation.getCurrentPosition(
                    (pos) => getWeatherData({lat: pos.coords.latitude, lon: pos.coords.longitude}, true),
                    () => { showError(true, "Location access denied."); showLoader(false); }
                );
            } else { showError(true, "Geolocation not supported."); }
        });
    </script>
</body>
</html>
